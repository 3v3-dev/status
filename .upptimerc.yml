owner: 3v3-dev
repo: status

sites:
  - name: App
    url: https://app.3v3.dev/api/health
    icon: https://status.3v3.dev/3v3/icon-32-dark.svg
  - name: Website
    url: https://3v3.dev
    icon: https://status.3v3.dev/3v3/icon-32-dark.svg
  - name: MCP
    url: https://mcp.3v3.dev/.well-known/oauth-protected-resource
    icon: https://status.3v3.dev/3v3/icon-32-dark.svg

# The response graph on a service's page, in Giagia's green (#2182).
graphBackgroundColor: "rgba(61, 220, 132, 0.14)"
graphBorderColor: "#3DDC84"

workflowSchedule:
  uptime: "*/5 * * * *"

status-website:
  cname: status.3v3.dev
  name: 3V3 status
  introTitle: "**3V3** service status"
  introMessage: Checked every 5 minutes from GitHub. Incidents open here on their own when a check fails.
  # The look of 3v3.dev and Giagia (#2182, founder #57): all of it in assets/3v3/, served from this site (no font
  # host, no icon service). tokens.css replaces Upptime's light/dark theme, status.css loads after its global.css,
  # status.js draws the LED bars and the big figures from the numbers Upptime puts on the page. Full addresses on
  # purpose: the build's crawler (sapper export) follows every same-site link and writes a 404 page as a FOLDER at
  # /3v3/status.css etc., and then copying assets/ over it fails; a full address it leaves alone. Same site still.
  # GitHub, read by our own server (#2183): the page's API and raw-file reads go to https://3v3.dev/status-api/,
  # where a one-minute cache answers them with our read-only token (deploy/v3-status-cache in the 3v3dev repo).
  # So no visitor meets GitHub's 60-an-hour limit, and GitHub never sees a visitor. Upptime's own two settings.
  apiBaseUrl: https://3v3.dev/status-api/gh
  userContentBaseUrl: https://3v3.dev/status-api/raw
  logoUrl: https://status.3v3.dev/3v3/wordmark-silkscreen.svg
  favicon: https://status.3v3.dev/3v3/icon-180.png
  faviconSvg: https://status.3v3.dev/3v3/icon-32-dark.svg
  themeUrl: https://status.3v3.dev/3v3/tokens.css
  links:
    - rel: stylesheet
      href: https://status.3v3.dev/3v3/status.css
  scripts:
    - src: https://status.3v3.dev/3v3/status.js
      async: true
  metaTags:
    - name: theme-color
      content: "#0D0D0C"
  navbar:
    - title: Status
      href: /
    - title: 3v3.dev
      href: https://3v3.dev
